[package]
name = "claude-panes"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "TUI dashboard to monitor and switch between Claude Code tmux sessions"
license = "MIT"
repository = "https://github.com/gunubin/claude-panes"
readme = "README.md"
authors = ["gunubin"]
keywords = ["tmux", "claude", "tui", "dashboard", "ai"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
unicode-width = "0.2"

[dev-dependencies]
filetime = "0.2"
